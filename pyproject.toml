[project]
name = "littio-de-tx-pipeline"
version = "0.1.0"
description = "Littio Senior DE take-home — transaction lifecycle medallion slice"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=0.10.0",
    "pytest>=7.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "project_db: use data/warehouse.duckdb instead of pytest tmp_path",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
